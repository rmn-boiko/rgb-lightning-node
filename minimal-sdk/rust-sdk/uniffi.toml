# Binding configuration for library-mode generation (no UDL file exists or
# may be added; every export is a proc macro in src/).
[bindings.kotlin]
package_name = "com.utexo.minimalsdk"
cdylib_name = "utexo_minimal_sdk"

[bindings.swift]
module_name = "MinimalSdk"
ffi_module_name = "MinimalSdkFFI"
ffi_module_filename = "MinimalSdkFFI"
cdylib_name = "utexo_minimal_sdk"
