[package]
name = "utexo-minimal-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
publish = false
description = "Minimal UTEXO client SDK core: keys, taproot derivation, verify-before-sign, invoices, gateway client. One Rust implementation exposed to Kotlin and Swift through uniffi."
license = "MIT"

[lib]
name = "utexo_minimal_sdk"
# cdylib: Android JNI library. staticlib: iOS XCFramework. lib: Rust tests and
# consumers (the uniffi-bindgen tool links nothing, it reads metadata symbols).
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# The whole allowed dependency set. No rgb-lib, no HTTP or TLS stack, no
# async runtime. Every addition is measured against the size gate in
# tests/parity.rs before it lands (docs/plans/20260915-minimal-mobile-rust-sdk.md).
# `secp-recovery` is a feature of the secp256k1 dependency bitcoin already
# carries (BOLT-11 payee recovery, Task 6), not a new crate.
bitcoin = { version = "0.32", default-features = false, features = ["std", "rand-std", "base64", "secp-recovery"] }
bip39 = { version = "2.2", default-features = false, features = ["std", "rand"] }
thiserror = "2.0"
# default-features = false drops `cargo-metadata` (a bindgen-side helper that
# would pull serde_json/semver into the shipped library graph).
uniffi = { version = "0.28.3", default-features = false }

[dev-dependencies]
# Test-only: parses the rgb-lib parity fixture. Must never become a normal
# dependency; tests/parity.rs asserts it is absent from the library graph.
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
# uniffi converts a Rust panic into a foreign exception at the FFI boundary.
# `panic = "abort"` would turn every recoverable error into a host-app crash
# (design doc, Block 2 item 9).
panic = "unwind"

# Own workspace: never pull the rgb-lightning-node dependency graph
# (same pattern as bindings/c-ffi/Cargo.toml).
[workspace]
