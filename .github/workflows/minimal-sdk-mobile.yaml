name: Minimal SDK Mobile

# CI for the minimal mobile SDK (docs/plans/20260915-minimal-mobile-rust-sdk.md,
# Task 10): one small Rust crate (minimal-sdk/rust-sdk) exposed to Kotlin and
# Swift through uniffi. It shares no code with the node, so it runs only when
# its own inputs change.
#
# The fixture path filter is deliberate. minimal-sdk/packages/client-sdk/test/
# fixtures/rgblib-parity.json is the rgb-lib-authored ground truth the Rust
# parity suite reads by relative path. If it is regenerated, the parity suite
# (and the Kotlin/Swift smoke tests, which read the same file) MUST re-run,
# even though no Rust source changed.
#
# bindings/uniffi-bindgen is the tool that generates the Kotlin and Swift
# bindings for jobs 2 and 3; a change there can break both packages.
#
# Every action is pinned to a commit SHA (the tag is in the comment).

on:
  push:
    branches: ["master", "dev", "stage"]
    paths:
      - "minimal-sdk/rust-sdk/**"
      - "minimal-sdk/android/**"
      - "minimal-sdk/apple/**"
      - "minimal-sdk/scripts/**"
      - "minimal-sdk/packages/client-sdk/test/fixtures/**"
      - "bindings/uniffi-bindgen/**"
      - ".github/workflows/minimal-sdk-mobile.yaml"
  pull_request:
    branches: ["master", "dev", "stage"]
    paths:
      - "minimal-sdk/rust-sdk/**"
      - "minimal-sdk/android/**"
      - "minimal-sdk/apple/**"
      - "minimal-sdk/scripts/**"
      - "minimal-sdk/packages/client-sdk/test/fixtures/**"
      - "bindings/uniffi-bindgen/**"
      - ".github/workflows/minimal-sdk-mobile.yaml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Matches rust-version in minimal-sdk/rust-sdk/Cargo.toml and the toolchain
  # the other workflows pin.
  RUST_TOOLCHAIN: "1.94.0"
  RUST_SDK_MANIFEST: minimal-sdk/rust-sdk/Cargo.toml

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Android. NDK, cargo ndk for the three ABIs, Kotlin bindings,
  # ./gradlew test (JVM smoke test through JNA against the host cdylib),
  # then assembleRelease, which runs minimal-sdk/scripts/build_android.sh
  # (16 KB PT_LOAD alignment on every .so, exported uniffi entry points,
  # arm64 raw-size budget) before bundling the AAR. The gates are re-printed
  # as their own step so a failure is readable without digging through
  # Gradle output.
  # ---------------------------------------------------------------------------
  android:
    name: Android (JNI libs, 16 KB alignment, size gate, AAR)
    runs-on: warp-ubuntu-latest-x64-16x
    timeout-minutes: 45
    env:
      # Consumed by nttld/setup-ndk's `ndk-version`; the resulting path is
      # exported as ANDROID_NDK_ROOT/ANDROID_NDK_HOME below, which is what
      # build_android.sh reads.
      NDK_VERSION: r29
      ANDROID_PLATFORM: "platforms;android-34"
      CARGO_NDK_VERSION: 4.1.2
      JAVA_VERSION: "17"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
          rustflags: ""
          cache: false

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # rust-sdk: host + three Android targets. uniffi-bindgen: the
          # binding generator, built with `cargo run` by generate_bindings.sh.
          workspaces: |
            minimal-sdk/rust-sdk -> target
            bindings/uniffi-bindgen -> target
          key: android

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle user home
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('minimal-sdk/android/gradle/wrapper/gradle-wrapper.properties', 'minimal-sdk/android/**/*.gradle.kts', 'minimal-sdk/android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
          link-to-sdk: true

      - name: Install Android platform and verify the NDK
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        # compileSdk 34 is installed explicitly, as release-sdk.yaml and
        # sdk-e2e.yaml do, rather than assumed to be on the runner image.
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be set (Android SDK root)}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "$ANDROID_PLATFORM" >/dev/null
          test -d "$ANDROID_HOME/platforms/android-34"
          test -f "$NDK_PATH/source.properties"
          sed -n 's/^Pkg.Revision = /NDK /p' "$NDK_PATH/source.properties"
          {
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "ANDROID_NDK_HOME=$NDK_PATH"
          } >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: |
          set -euo pipefail
          if cargo ndk --version 2>/dev/null | grep -q "cargo-ndk $CARGO_NDK_VERSION"; then
            echo "cargo-ndk $CARGO_NDK_VERSION already installed (cache)"
          else
            cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          fi
          cargo ndk --version

      - name: Gradle test and assembleRelease
        # `test` builds the host cdylib and generates the Kotlin bindings
        # itself (uniffi library mode, no UDL) and runs the Kotlin smoke test.
        # `assembleRelease` runs build_android.sh (cargo ndk for the three
        # ABIs + the alignment and size gates) before bundling the AAR.
        run: ./minimal-sdk/android/gradlew -p minimal-sdk/android --no-daemon --console=plain test assembleRelease

      - name: 16 KB alignment, exported entry points and arm64 size gate
        run: ./minimal-sdk/scripts/build_android.sh --check-only minimal-sdk/android/generated/jniLibs

      - name: Upload Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minimal-sdk-android
          if-no-files-found: error
          path: |
            minimal-sdk/android/build/outputs/aar/*.aar
            minimal-sdk/android/generated/jniLibs/**
            minimal-sdk/android/generated/kotlin/**

  # ---------------------------------------------------------------------------
  # Job 2: Apple. This is the job that first proves Task 9: the plan's dev
  # machine has no Xcode, so the static libraries, lipo, the XCFramework and
  # the Swift smoke test on the real XCFramework were never run locally.
  # build_apple.sh builds release staticlibs for the iOS device target, the
  # two simulator targets and the two macOS targets, generates the Swift
  # bindings, lipos the simulator and macOS slices, runs
  # `xcodebuild -create-xcframework` and checks the device slice exports the
  # uniffi entry points. `swift test` then runs the smoke test on the macOS
  # slice through the package's binaryTarget.
  # ---------------------------------------------------------------------------
  apple:
    name: Apple (XCFramework, Swift smoke test)
    runs-on: warp-macos-latest-arm64-6x
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin, x86_64-apple-darwin
          rustflags: ""
          cache: false

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            minimal-sdk/rust-sdk -> target
            bindings/uniffi-bindgen -> target
          key: apple

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          rustc --version

      - name: Build static libraries, Swift bindings and XCFramework
        run: ./minimal-sdk/scripts/build_apple.sh

      - name: Swift smoke test (macOS slice of the XCFramework)
        run: swift test --package-path minimal-sdk/apple

      - name: Upload Apple artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minimal-sdk-apple
          if-no-files-found: error
          path: |
            minimal-sdk/apple/MinimalSdkFFI.xcframework/**
            minimal-sdk/apple/Sources/MinimalSdk/Generated/**
            minimal-sdk/apple/Sources/MinimalSdkFFI/**
